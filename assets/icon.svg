<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232638"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="room" cx="256" cy="340" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a6cff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#0a6cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer" x1="0" y1="128" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="178" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="218" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ccaff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
    <radialGradient id="orb" cx="250" cy="296" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9ccaff"/>
      <stop offset="1" stop-color="#2a82ff"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="wide" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#room)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#shine)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- light that spills out of the innermost doorway onto the floor -->
  <ellipse cx="256" cy="380" rx="92" ry="16" fill="#2a82ff" opacity="0.65" filter="url(#wide)"/>

  <g fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 374 V274 A136 136 0 0 1 392 274 V374" stroke="url(#outer)"/>
    <path d="M160 374 V274 A96 96 0 0 1 352 274 V374" stroke="url(#middle)"/>
    <path d="M200 374 V274 A56 56 0 0 1 312 274 V374" stroke="#0a6cff" opacity="0.75" filter="url(#soft)"/>
    <path d="M200 374 V274 A56 56 0 0 1 312 274 V374" stroke="url(#inner)"/>
  </g>

  <!-- the light inside the innermost doorway -->
  <circle cx="256" cy="304" r="30" fill="#2a82ff" opacity="0.55" filter="url(#soft)"/>
  <circle cx="256" cy="304" r="17" fill="url(#orb)"/>
</svg>
